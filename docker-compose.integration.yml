services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tvic
      POSTGRES_PASSWORD: tvic_local
      POSTGRES_DB: tvic
    ports:
      - "55432:5432"
    volumes:
      - tvic-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvic -d tvic"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - tvic-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  tvic-postgres-data:
  tvic-redis-data:
