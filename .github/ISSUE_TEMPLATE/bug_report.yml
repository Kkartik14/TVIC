name: Bug report
description: Report a reproducible problem in TVIC.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. For a security vulnerability, stop here and use the [private security reporting process](https://github.com/Kkartik14/TVIC/security/advisories/new) instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before opening
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and why it is a problem.
      placeholder: A concise description of the failure...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the behavior that should have occurred.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproduction, including relevant configuration and logs.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TVIC version
      placeholder: voice-runtime@1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node version, OS, provider, transport, database, or Redis version
    validations:
      required: true

