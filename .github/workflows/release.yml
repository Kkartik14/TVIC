name: Release

# Publishes the `voice-runtime` npm package.
#
# Trigger: push a tag shaped `voice-runtime-v<version>` whose version matches
# packages/voice-runtime/package.json. The tag is the single source of intent, and
# the version guard below refuses to publish when the two disagree. That mismatch
# is exactly how the registry and the repository drifted apart before.
#
#   npm version --no-git-tag-version <new>   # inside packages/voice-runtime
#   git commit -am "chore(voice-runtime): release v<new>"
#   git tag voice-runtime-v<new> && git push --follow-tags
#
# The tag push is the complete release action. No GitHub Release needs to be
# created manually; the publish job creates it after npm accepts the package.
# If a release already exists (for example, one created ahead of the workflow),
# the workflow leaves it in place and still succeeds.
#
# Use the workflow_dispatch "dry_run" input to exercise the whole pipeline
# (including the npm OIDC handshake) without publishing.

on:
  push:
    tags:
      - "voice-runtime-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every step but stop short of publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-voice-runtime
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 21, 22, 23, 24, 25, 26]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tvic
          POSTGRES_DB: tvic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tvic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Create memory database
        run: PGPASSWORD=tvic psql -h 127.0.0.1 -U postgres -d tvic -v ON_ERROR_STOP=1 -c "CREATE DATABASE tvic_memory"
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @tvic/dal-composite test
        env:
          TVIC_RUN_INTEGRATION: "1"
          DATABASE_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic
          REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm --filter @tvic/dal-postgres-memory test
        env:
          TVIC_RUN_INTEGRATION: "1"
          MEMORY_INTEGRATION_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic_memory
      - run: pnpm --filter @tvic/dal-memory-validation test
        env:
          TVIC_RUN_INTEGRATION: "1"
          MEMORY_INTEGRATION_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic_memory
      - run: pnpm build
      - run: node scripts/check-package-exports.mjs
      - run: node scripts/check-public-package.mjs
      - run: node scripts/check-public-durable-integrations.mjs
        env:
          DATABASE_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic
          MEMORY_INTEGRATION_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic_memory
          REDIS_URL: redis://127.0.0.1:6379

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # No `environment:` here on purpose. Leave the Environment field blank in the
    # npm trusted publisher config so the two cannot disagree. Add both together
    # later if you want a manual approval gate before publish.
    permissions:
      contents: write # create the GitHub Release
      id-token: write # mint the OIDC token npm trusted publishing consumes
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1, which is
      # newer than the Node 20 the runtime itself targets. This job is publish-only,
      # so it can run ahead without moving the runtime's supported floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Resolve and verify version
        id: version
        working-directory: packages/voice-runtime
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "package=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#voice-runtime-v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION but package.json declares $PKG_VERSION."
              exit 1
            fi
          fi

          if npm view "voice-runtime@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::voice-runtime@$PKG_VERSION is already published. Bump the version before tagging."
            exit 1
          fi

      # The verification matrix runs on separate, temporary machines. Its build
      # output is not available here, so the publishing machine must build the
      # package it is about to send to npm.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publish artifact
        # The trailing `...` includes every internal package voice-runtime
        # depends on, so their declaration files exist on this clean runner.
        run: pnpm --filter "voice-runtime..." build

      - name: Verify publish artifact contents
        working-directory: packages/voice-runtime
        run: |
          set -euo pipefail
          test -s dist/index.js
          test -s dist/index.cjs
          test -s dist/index.d.ts
          npm pack --dry-run --json >/dev/null

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/voice-runtime
        env:
          # TVIC is a public repository, so npm can attach a provenance attestation
          # linking each published tarball back to the exact commit and workflow run
          # that produced it. This only works from a public repo, which is why it was
          # disabled while TVIC was private.
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --access public

      - name: Report dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run: verified gates, npm auth setup, and version ${{ steps.version.outputs.package }}. Nothing published."

      - name: Create GitHub Release if missing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "voice-runtime v${{ steps.version.outputs.package }}" \
              --generate-notes
          fi
