name: npm release

# Publishing is controlled from the GitHub Releases tab. This workflow never
# commits, pushes, tags, or creates a GitHub Release from an Action.
on:
  release:
    types: [published]

permissions:
  contents: read
  checks: read

concurrency:
  group: release-voice-runtime
  cancel-in-progress: false

jobs:
  release_lint:
    name: Release lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:node-support
      - run: pnpm check:persisted-errors
      - run: node scripts/check-acceptance-evidence.mjs --require-files
      - run: node scripts/check-error-code-evidence-runners.mjs
      - run: pnpm check:error-inventory:release
      - run: node scripts/check-dynamic-code-policy-fixture.mjs
      - run: pnpm check:release-workflow

  release_security:
    name: Release security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:security
      - run: pnpm build
      - run: pnpm --filter @tvic/providers test
      - run: pnpm --filter @tvic/example-live-call test

  package_artifact:
    name: Build exact package artifact
    needs: [release_lint, release_security]
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.source.outputs.package_version }}
      tag_sha: ${{ steps.source.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install an npm version that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify release source and version
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APPROVED_RELEASE_SHA: ${{ vars.RELEASE_APPROVED_SHA }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          case "$RELEASE_TAG" in
            voice-runtime-v*) TAG_VERSION="${RELEASE_TAG#voice-runtime-v}" ;;
            *) echo "::error::Release tag must match voice-runtime-v<version>."; exit 1 ;;
          esac
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
          MAIN_SHA="$(git rev-parse origin/main^{commit})"
          test -n "$TAG_SHA"
          if [ -z "$APPROVED_RELEASE_SHA" ]; then
            echo "::error::Repository variable RELEASE_APPROVED_SHA is required for a release.";
            exit 1
          fi
          test "$TAG_SHA" = "$APPROVED_RELEASE_SHA"
          test "$TAG_SHA" = "$MAIN_SHA"

          NPM_STATUS="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/voice-runtime/$TAG_VERSION")"
          case "$NPM_STATUS" in
            200)
              echo "::error::voice-runtime@$TAG_VERSION is already published. Bump the package version before creating a release."
              exit 1
              ;;
            404) ;;
            *)
              echo "::error::Could not prove voice-runtime@$TAG_VERSION is unpublished (npm registry HTTP $NPM_STATUS)."
              exit 1
              ;;
          esac

          CHECKS_JSON="$RUNNER_TEMP/verify-checks.json"
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$API_URL/repos/$REPOSITORY/commits/$TAG_SHA/check-runs?per_page=100" > "$CHECKS_JSON"
          node - "$CHECKS_JSON" "$TAG_SHA" <<'NODE'
          const fs = require("node:fs");
          const [file, sha] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const verify = (payload.check_runs ?? []).find(
            (check) => check.name === "Verify" && check.head_sha === sha,
          );
          if (!verify || verify.conclusion !== "success") {
            throw new Error(`Verify has not passed for ${sha}`);
          }
          NODE

          PKG_VERSION="$(node -p "require('./packages/voice-runtime/package.json').version")"
          test "$TAG_VERSION" = "$PKG_VERSION"
          echo "package_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "voice-runtime..." build
      - name: Create the one publishable tarball
        id: pack
        working-directory: packages/voice-runtime
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/voice-runtime-artifact"
          mkdir -p "$ARTIFACT_DIR"
          npm pack --pack-destination "$ARTIFACT_DIR" --ignore-scripts --json > "$ARTIFACT_DIR/pack.json"
          TARBALL="$(find "$ARTIFACT_DIR" -maxdepth 1 -name '*.tgz' -type f -print -quit)"
          test -n "$TARBALL"
          (cd "$ARTIFACT_DIR" && sha256sum "$(basename "$TARBALL")" > SHA256SUMS)
          node - "$ARTIFACT_DIR" "$TARBALL" "${{ steps.source.outputs.tag_sha }}" "${{ steps.source.outputs.package_version }}" <<'NODE'
          const fs = require("node:fs");
          const [directory, tarball, commit, version] = process.argv.slice(2);
          const metadata = {
            package: "voice-runtime",
            version,
            commit,
            tarball: require("node:path").basename(tarball),
            node: process.version,
            npm: require("child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(),
          };
          fs.writeFileSync(require("node:path").join(directory, "release-metadata.json"), JSON.stringify(metadata, null, 2) + "\n");
          NODE
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload exact artifact and its identity record
        uses: actions/upload-artifact@v4
        with:
          name: voice-runtime-release-artifact
          if-no-files-found: error
          path: ${{ runner.temp }}/voice-runtime-artifact

  release_verify:
    name: Verify exact artifact and integrations
    needs: [package_artifact]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tvic
          POSTGRES_DB: tvic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tvic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/download-artifact@v4
        with:
          name: voice-runtime-release-artifact
          path: ${{ runner.temp }}/voice-runtime-artifact

      - run: pnpm install --frozen-lockfile
      - name: Create memory database
        run: PGPASSWORD=tvic psql -h 127.0.0.1 -U postgres -d tvic -v ON_ERROR_STOP=1 -c "CREATE DATABASE tvic_memory"
      - run: pnpm build
      - name: Run deterministic tests
        env:
          TVIC_RUN_INTEGRATION: ""
          DATABASE_URL: ""
          MEMORY_INTEGRATION_URL: ""
          REDIS_URL: ""
        run: pnpm test
      - name: Run durable adapter tests
        env:
          TVIC_RUN_INTEGRATION: "1"
          DATABASE_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic
          MEMORY_INTEGRATION_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic_memory
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          pnpm --filter @tvic/dal-composite test
          pnpm --filter @tvic/dal-postgres-memory test
          pnpm --filter @tvic/dal-memory-validation test
      - name: Run shared TwiML replay test
        env:
          TVIC_RUN_INTEGRATION: "1"
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm --filter @tvic/example-live-call test -- test/replay-redis.test.ts
      - run: pnpm check:exports
      - name: Verify the exact packed ESM, CJS, and TypeScript artifact
        run: node scripts/check-public-package.mjs --tarball "$(find "$RUNNER_TEMP/voice-runtime-artifact" -name '*.tgz' -type f -print -quit)"
      - name: Verify durable adapters through the exact packed artifact
        env:
          DATABASE_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic
          MEMORY_INTEGRATION_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic_memory
          REDIS_URL: redis://127.0.0.1:6379
        run: node scripts/check-public-durable-artifact.mjs --tarball "$(find "$RUNNER_TEMP/voice-runtime-artifact" -name '*.tgz' -type f -print -quit)"

  package_compatibility:
    name: Packed consumer Node ${{ matrix.node-version }}
    needs: [package_artifact]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: voice-runtime-release-artifact
          path: ${{ runner.temp }}/voice-runtime-artifact

      - name: Test the exact tarball as an external consumer
        run: node scripts/check-packed-consumer.mjs --tarball "$(find "$RUNNER_TEMP/voice-runtime-artifact" -name '*.tgz' -type f -print -quit)"

  publish:
    name: Publish to npm
    needs:
      [
        release_lint,
        release_security,
        release_verify,
        package_artifact,
        package_compatibility,
      ]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: voice-runtime-release-artifact
          path: ${{ runner.temp }}/voice-runtime-artifact

      - name: Verify artifact identity before publish
        working-directory: ${{ runner.temp }}/voice-runtime-artifact
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_VERSION: ${{ needs.package_artifact.outputs.package_version }}
          EXPECTED_COMMIT: ${{ needs.package_artifact.outputs.tag_sha }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          node - <<'NODE'
          const fs = require("node:fs");
          const metadata = JSON.parse(fs.readFileSync("release-metadata.json", "utf8"));
          if (metadata.version !== process.env.EXPECTED_VERSION) throw new Error("artifact version mismatch");
          if (metadata.commit !== process.env.EXPECTED_COMMIT) throw new Error("artifact commit mismatch");
          if (metadata.tarball !== `voice-runtime-${metadata.version}.tgz`) throw new Error("unexpected artifact filename");
          NODE
          case "$RELEASE_TAG" in
            voice-runtime-v*) test "${RELEASE_TAG#voice-runtime-v}" = "$EXPECTED_VERSION" ;;
            *) echo "invalid release tag" >&2; exit 1 ;;
          esac

      - name: Publish the tested tarball with provenance
        working-directory: ${{ runner.temp }}/voice-runtime-artifact
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish "./voice-runtime-${{ needs.package_artifact.outputs.package_version }}.tgz" --access public
