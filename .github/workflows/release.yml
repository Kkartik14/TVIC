name: npm release

# Publishes the `voice-runtime` npm package.
#
# Trigger: publish a GitHub Release from the Releases tab with a tag shaped
# `voice-runtime-v<version>`. The release tag is the single source of intent, and
# the version guard below refuses to publish when the tag and
# packages/voice-runtime/package.json disagree.
#
# The version change must already be merged through the normal pull-request
# process before the GitHub Release is created. Actions never commits to main,
# creates tags, or creates GitHub Releases.
#
# Creating and publishing the GitHub Release is the explicit release action.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-voice-runtime
  cancel-in-progress: false

jobs:
  # Static checks do not vary by runtime version. Run them once without
  # provisioning database services.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Check Node support metadata and evidence
        run: pnpm check:node-support
      - name: Check persisted-error consumers
        run: pnpm check:persisted-errors
      - name: Check acceptance evidence files
        run: node scripts/check-acceptance-evidence.mjs --require-files
      - name: Check error-code evidence runners
        run: node scripts/check-error-code-evidence-runners.mjs
      - name: Check release error-code inventory
        run: pnpm check:error-inventory:release
      - name: Check dynamic-code policy boundaries
        run: node scripts/check-dynamic-code-policy-fixture.mjs

  # A release needs one complete exact-tag verification. Runtime compatibility
  # coverage is already maintained by the main-branch CI matrix; repeating it
  # here would multiply release cost without testing a different artifact.
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tvic
          POSTGRES_DB: tvic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tvic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Create memory database
        run: PGPASSWORD=tvic psql -h 127.0.0.1 -U postgres -d tvic -v ON_ERROR_STOP=1 -c "CREATE DATABASE tvic_memory"
      # Build before testing: package tests exercise workspace exports, and a
      # clean runner has no ignored dist/ directories yet.
      - name: Build workspace packages for verification
        run: pnpm build
      - name: Run package tests without durable services
        env:
          TVIC_RUN_INTEGRATION: ""
          DATABASE_URL: ""
          MEMORY_INTEGRATION_URL: ""
          REDIS_URL: ""
        run: pnpm test
      - run: pnpm --filter @tvic/dal-composite test
        env:
          TVIC_RUN_INTEGRATION: "1"
          DATABASE_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic
          REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm --filter @tvic/dal-postgres-memory test
        env:
          TVIC_RUN_INTEGRATION: "1"
          MEMORY_INTEGRATION_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic_memory
      - run: pnpm --filter @tvic/dal-memory-validation test
        env:
          TVIC_RUN_INTEGRATION: "1"
          MEMORY_INTEGRATION_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic_memory
      # Proves the built `exports` maps resolve at runtime, not just under tsc.
      - run: node scripts/check-package-exports.mjs
      # Proves the actual npm tarball works outside the workspace, including
      # ESM, CommonJS, and TypeScript consumer resolution.
      - run: node scripts/check-public-package.mjs
      # Proves the built public artifact drives the advertised durable adapters.
      - run: node scripts/check-public-durable-integrations.mjs
        env:
          DATABASE_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic
          MEMORY_INTEGRATION_URL: postgres://postgres:tvic@127.0.0.1:5432/tvic_memory
          REDIS_URL: redis://127.0.0.1:6379

  publish:
    name: Publish to npm
    needs: [lint, verify]
    runs-on: ubuntu-latest
    # No `environment:` here on purpose. Leave the Environment field blank in the
    # npm trusted publisher config so the two cannot disagree. Add both together
    # later if you want a manual approval gate before publish.
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm trusted publishing consumes
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1. Use the
      # canonical Node 24 runtime for the publish-only job.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Resolve and verify version
        id: version
        working-directory: packages/voice-runtime
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "package=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          case "$RELEASE_TAG" in
            voice-runtime-v*)
              TAG_VERSION="${RELEASE_TAG#voice-runtime-v}"
              ;;
            *)
              echo "::error::Release tag $RELEASE_TAG must match voice-runtime-v<version>."
              exit 1
              ;;
          esac

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG implies version $TAG_VERSION but package.json declares $PKG_VERSION."
            exit 1
          fi

          if npm view "voice-runtime@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::voice-runtime@$PKG_VERSION is already published. Bump the version before tagging."
            exit 1
          fi

      # The verification matrix runs on separate, temporary machines. Its build
      # output is not available here, so the publishing machine must build the
      # package it is about to send to npm.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publish artifact
        # The trailing `...` includes every internal package voice-runtime
        # depends on, so their declaration files exist on this clean runner.
        run: pnpm --filter "voice-runtime..." build

      - name: Verify publish artifact contents
        working-directory: packages/voice-runtime
        run: |
          set -euo pipefail
          test -s dist/index.js
          test -s dist/index.cjs
          test -s dist/index.d.ts
          npm pack --dry-run --json >/dev/null

      - name: Publish
        working-directory: packages/voice-runtime
        env:
          # TVIC is a public repository, so npm can attach a provenance attestation
          # linking each published tarball back to the exact commit and workflow run
          # that produced it. This only works from a public repo, which is why it was
          # disabled while TVIC was private.
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --access public
